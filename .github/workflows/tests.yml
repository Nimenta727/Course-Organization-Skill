name: Unit checks
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate fictional sample course
        run: course-org validate examples/sample-course
      - name: Confirm release defaults BLOCK
        run: |
          if course-org audit examples/sample-course; then
            echo "Unexpected audit pass"
            exit 1
          fi
