name: "Bug report / 错误反馈"
description: "Report a reproducible issue without posting private teacher or student content."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic or anonymized examples.
        Do not include teacher slides, private exams, student data, secrets or unsafe attachments.
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: "v0.2.1 / Python 3.11"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Component / 模块
      options:
        - Skill instructions
        - Python CLI
        - Course templates
        - Source/rights policy
        - Documentation or setup
        - Tests / CI
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened? / 实际行为
      description: "Observed behavior using anonymized examples."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal safe reproduction / 最小重现
      description: "Commands and synthetic inputs only."
      render: shell
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Checks already run / 已执行测试
      description: "State exact results or note that tests were not run."
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check / 隐私审查
      options:
        - label: "I did not attach private teacher materials, student data, credentials or restricted exam contents."
          required: true
